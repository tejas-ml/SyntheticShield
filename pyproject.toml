[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntheticshield"
version = "0.1.0"
description = "Auditing memorization and membership leakage in synthetic data generators"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Tejas Mahajan"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7"
]

[tool.setuptools]
packages = ["syntheticshield"]
